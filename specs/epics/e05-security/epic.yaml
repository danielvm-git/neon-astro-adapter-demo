      - "Write/update Vitest unit test asserting that a crafted email with HTML entities is not parsed as markup"
      - "Run npx vitest run and npx astro check — must pass"
    verify:
      - "grep -qv 'innerHTML' src/components/ProfileClient.astro"
      - "npx vitest run"
      - "npx astro check"

